# Local Windows development clients reach the published loopback ports.
# Do not use this loopback advertisement for clients in other containers/hosts.
brokerClusterName=CampusDevCluster
brokerName=campus-dev-broker
brokerId=0
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
namesrvAddr=namesrv:9876
brokerIP1=127.0.0.1
listenPort=10911
storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog
autoCreateTopicEnable=false
autoCreateSubscriptionGroup=false
deleteWhen=04
fileReservedTime=24
diskMaxUsedSpaceRatio=85
# Reduce development-machine footprint (default commitlog files are 1 GiB).
mappedFileSizeCommitLog=67108864
transientStorePoolEnable=false
